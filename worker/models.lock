# Pinned model weights for the worker. Fetched and verified by
# `just fetch-models` (worker/scripts/fetch_models.py) into
# $NOTECAST_MODELS_DIR (default ~/.local/share/notecast/models).
#
# Each [[file]] is one download. `group` ties a GGUF to its mmproj; the
# worker config refers to files by `name`. Hugging Face URLs are pinned to a
# commit, so a re-upload upstream can't change what we get. The sha256 is
# checked regardless.
#
# The four VLMs are Phase 0 candidates (see docs/IMPLEMENTATION-PLAN.md);
# all but the winner get dropped after the eval.

